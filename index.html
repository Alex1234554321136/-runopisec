<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Русская руническая клавиатура</title>

<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;
    padding:20px;

    background:#111;
    color:white;

    font-family:Arial,sans-serif;

    text-align:center;

}


h1{

    font-size:30px;

}



#mode{

    margin:10px;

    font-size:18px;

    color:#ccc;

}



#text{

    width:95%;

    min-height:120px;

    padding:12px;

    font-size:26px;

    background:#222;

    color:white;

    border:2px solid #666;

    border-radius:12px;

}



.toolbar{

    margin-top:20px;

}



.group{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:8px;

    margin-bottom:10px;

}



button{

    background:#333;

    color:white;

    border:2px solid #777;

    border-radius:10px;

    padding:12px;

    font-size:16px;

}



button:active{

    background:#555;

}



.keyboard{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;

    margin-top:25px;

}



.key{

    background:#222;

    border:2px solid #777;

    border-radius:12px;

    padding:12px 5px;

}



.rune{

    font-size:40px;

}



.letter{

    font-size:18px;

    color:#ccc;

    margin-top:5px;

}



/* окна */

.window{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,0.8);

    z-index:10;

    padding:30px;

}



.window-box{

    background:#222;

    border:2px solid #777;

    border-radius:15px;

    padding:20px;

    max-height:80%;

    overflow:auto;

}



.card{

    background:#333;

    border:1px solid #777;

    border-radius:10px;

    padding:15px;

    margin:10px;

    font-size:20px;

}



.card button{

    margin:5px;

}



/* светлая тема */

.light{

    background:#eee;

    color:#111;

}


.light #text{

    background:white;

    color:black;

}


.light .key{

    background:white;

    color:black;

}


.light button{

    background:white;

    color:black;

}


</style>

</head>


<body>


<h1>ᚱ Русская руническая клавиатура</h1>


<div id="mode">
Режим: Руны
</div>


<div class="toolbar">


<div class="group">

<button onclick="copyText()">📋 Копировать</button>

<button onclick="downloadTXT()">💾 TXT</button>

<button onclick="makeImage()">🖼 В картинку</button>

<button onclick="changeTheme()">🎨 Тема</button>

</div>


<div class="group">

<button onclick="switchMode()">🔄 Руны / Буквы</button>

<button onclick="translateText()">🔄 Перевести</button>

</div>


<div class="group">

<button onclick="saveFavorite()">⭐ Сохранить</button>

<button onclick="openFavorites()">📂 Избранное</button>

</div>


<div class="group">

<button onclick="saveHistory()">💾 В историю</button>

<button onclick="openHistory()">📖 История</button>

</div>


<div class="group">

<button onclick="deleteText()">⌫ Удалить</button>

<button onclick="spaceText()">␣ Пробел</button>

<button onclick="clearText()">🗑 Очистить</button>

</div>


</div>


<textarea id="text" readonly></textarea>


<div class="keyboard" id="keyboard"></div>


<!-- окно избранного -->

<div class="window" id="favoritesWindow">

<div class="window-box">

<h2>⭐ Избранное</h2>

<div id="favoritesList"></div>

<button onclick="closeFavorites()">Закрыть</button>

</div>

</div>


<!-- окно истории -->

<div class="window" id="historyWindow">

<div class="window-box">

<h2>📖 История</h2>

<div id="historyList"></div>

<button onclick="closeHistory()">Закрыть</button>

</div>

</div>
<script>

const runes = [

["ᚨ","А"],
["ᛒ","Б"],
["ᚹ","В"],
["ᚷ","Г"],

["ᛞ","Д"],
["ᛖ","Е"],
["ᛖ","Ё"],
["ᛃ","Ж"],

["ᛉ","З"],
["ᛁ","И"],
["ᛃ","Й"],
["ᚲ","К"],

["ᛚ","Л"],
["ᛗ","М"],
["ᚾ","Н"],
["ᛟ","О"],

["ᛈ","П"],
["ᚱ","Р"],
["ᛋ","С"],
["ᛏ","Т"],

["ᚢ","У"],
["ᚠ","Ф"],
["ᚺ","Х"],

["ᛏᛋ","Ц"],
["ᚲᚺ","Ч"],
["ᛋᚺ","Ш"],
["ᛋᚲ","Щ"],

["ᛁ","Ы"],
["ᛖ","Э"],

["ᛃᚢ","Ю"],
["ᛃᚨ","Я"],

["ᛜ","НГ"]

];


let output = document.getElementById("text");

let keyboard = document.getElementById("keyboard");

let modeText = document.getElementById("mode");


let runeMode = true;



// создание клавиатуры

runes.forEach(function(r){


    let key = document.createElement("div");


    key.className = "key";


    key.innerHTML = `

    <div class="rune">${r[0]}</div>

    <div class="letter">${r[1]}</div>

    `;



    key.onclick = function(){


        if(runeMode){

            output.value += r[0];

        }else{

            output.value += r[1];

        }


    };



    keyboard.appendChild(key);


});
  // ===== ОСНОВНЫЕ ФУНКЦИИ =====


function switchMode(){

    runeMode = !runeMode;


    if(runeMode){

        modeText.innerHTML = "Режим: Руны";

    }else{

        modeText.innerHTML = "Режим: Буквы";

    }

}



function deleteText(){

    let text = output.value;


    if(text.length > 0){

        output.value = text.slice(0,-1);

    }

}



function clearText(){

    output.value = "";

}



function spaceText(){

    output.value += " ";

}



function copyText(){

    navigator.clipboard.writeText(output.value);

    alert("Скопировано 📋");

}



function downloadTXT(){

    let blob = new Blob(

        [output.value],

        {
            type:"text/plain;charset=utf-8"
        }

    );


    let link = document.createElement("a");


    link.href = URL.createObjectURL(blob);


    link.download = "runopisec.txt";


    link.click();

}



function changeTheme(){

    document.body.classList.toggle("light");

}



// ===== ПЕРЕВОД =====


function russianToRunes(text){

    let result = "";


    for(let char of text.toUpperCase()){


        let found = runes.find(r => r[1] === char);


        if(found){

            result += found[0];

        }else{

            result += char;

        }


    }


    return result;

}



function runesToRussian(text){

    let result = text;


    // сначала сложные руны

    result = result.split("ᛃᚢ").join("Ю");
    result = result.split("ᛃᚨ").join("Я");
    result = result.split("ᛏᛋ").join("Ц");
    result = result.split("ᚲᚺ").join("Ч");
    result = result.split("ᛋᚺ").join("Ш");
    result = result.split("ᛋᚲ").join("Щ");


    runes.forEach(function(r){


        if(r[0].length === 1){

            result = result.split(r[0]).join(r[1]);

        }


    });


    return result;

}



function translateText(){


    if(runeMode){


        output.value = runesToRussian(output.value);

        runeMode = false;

        modeText.innerHTML = "Режим: Буквы";


    }else{


        output.value = russianToRunes(output.value);

        runeMode = true;

        modeText.innerHTML = "Режим: Руны";


    }


}
  // ===== ИЗБРАННОЕ =====


function saveFavorite(){

    if(output.value.length === 0){

        alert("Нет текста");

        return;

    }


    let favorites = JSON.parse(
        localStorage.getItem("favorites")
    ) || [];


    favorites.push(output.value);


    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );


    alert("Добавлено в избранное ⭐");

}



function openFavorites(){

    let favorites = JSON.parse(
        localStorage.getItem("favorites")
    ) || [];


    let box = document.getElementById("favoritesList");


    box.innerHTML = "";


    if(favorites.length === 0){

        box.innerHTML = "<p>Избранное пусто</p>";

    }


    favorites.forEach(function(item,index){


        let card = document.createElement("div");

        card.className = "card";


        card.innerHTML = `

        <div>${item}</div>

        <button onclick="loadFavorite(${index})">
        Открыть
        </button>

        <button onclick="deleteFavorite(${index})">
        Удалить
        </button>

        `;


        box.appendChild(card);


    });


    document.getElementById("favoritesWindow").style.display="block";

}



function closeFavorites(){

    document.getElementById("favoritesWindow").style.display="none";

}



function loadFavorite(index){

    let favorites = JSON.parse(
        localStorage.getItem("favorites")
    ) || [];


    output.value = favorites[index];


    closeFavorites();

}



function deleteFavorite(index){

    let favorites = JSON.parse(
        localStorage.getItem("favorites")
    ) || [];


    favorites.splice(index,1);


    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );


    openFavorites();

}



// ===== ИСТОРИЯ =====


function saveHistory(){

    if(output.value.length === 0){

        alert("Нет текста");

        return;

    }


    let history = JSON.parse(
        localStorage.getItem("history")
    ) || [];


    history.push(output.value);


    if(history.length > 20){

        history.shift();

    }


    localStorage.setItem(
        "history",
        JSON.stringify(history)
    );


    alert("Сохранено в историю 📖");

}



function openHistory(){

    let history = JSON.parse(
        localStorage.getItem("history")
    ) || [];


    let box = document.getElementById("historyList");


    box.innerHTML = "";


    if(history.length === 0){

        box.innerHTML = "<p>История пуста</p>";

    }


    history.forEach(function(item,index){


        let card = document.createElement("div");

        card.className = "card";


        card.innerHTML = `

        <div>${item}</div>

        <button onclick="loadHistory(${index})">
        Открыть
        </button>

        <button onclick="deleteHistory(${index})">
        Удалить
        </button>

        `;


        box.appendChild(card);


    });


    document.getElementById("historyWindow").style.display="block";

}



function closeHistory(){

    document.getElementById("historyWindow").style.display="none";

}



function loadHistory(index){

    let history = JSON.parse(
        localStorage.getItem("history")
    ) || [];


    output.value = history[index];


    closeHistory();

}



function deleteHistory(index){

    let history = JSON.parse(
        localStorage.getItem("history")
    ) || [];


    history.splice(index,1);


    localStorage.setItem(
        "history",
        JSON.stringify(history)
    );


    openHistory();

}



function clearHistory(){

    localStorage.removeItem("history");


    openHistory();

}
  // ===== СОЗДАНИЕ КАРТИНКИ =====


function makeImage(){


    if(output.value.length === 0){

        alert("Нет текста для картинки");

        return;

    }



    let canvas = document.createElement("canvas");


    canvas.width = 900;

    canvas.height = 350;



    let ctx = canvas.getContext("2d");



    // фон

    ctx.fillStyle = "#222";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );



    // руны

    ctx.fillStyle = "#ffffff";

    ctx.font = "70px Arial";

    ctx.textAlign = "center";


    ctx.fillText(
        output.value,
        450,
        140
    );



    // русский текст

    let russian = runesToRussian(output.value);



    ctx.font = "40px Arial";


    ctx.fillText(
        russian,
        450,
        230
    );



    // сохранение

    let link = document.createElement("a");


    link.download = "runopisec.png";


    link.href = canvas.toDataURL();



    link.click();


}



// ===== ЗАВЕРШЕНИЕ =====


</script>


</body>

</html>
