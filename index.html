<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Русская руническая письменность</title>

<style>

body {
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:20px;
}

h1 {
    font-size:30px;
}

textarea {
    width:90%;
    height:120px;
    font-size:22px;
    padding:10px;
    border-radius:10px;
}

button {
    margin:15px;
    padding:15px 25px;
    font-size:18px;
    border-radius:10px;
}

#output {
    margin-top:25px;
    font-size:45px;
    line-height:1.5;
}

</style>

</head>


<body>

<h1>ᚱᚢᚾᛟᛈᛁᛊᛖᚲ</h1>

<h2>Русская руническая письменность</h2>


<textarea id="input"
placeholder="Введите русский текст"></textarea>


<br>

<button onclick="translateRunes()">
Перевести в руны
</button>


<div id="output"></div>


<script>


const alphabet = {

"А":"ᚨ",
"Б":"ᛒ",
"В":"ᚹ",
"Г":"ᚷ",
"Д":"ᛞ",

"Е":"ᛖ",
"Ё":"ᛖ",
"Э":"ᛖ",

"Ж":"ᚦ",
"Ш":"ᚦ",
"Ч":"ᚦ",
"Щ":"ᚦ",

"З":"ᛉ",

"И":"ᛁ",
"Й":"ᛁ",
"Ы":"ᛁ",

"К":"ᚲ",
"Л":"ᛚ",
"М":"ᛗ",
"Н":"ᚾ",

"О":"ᛟ",

"П":"ᛈ",

"Р":"ᚱ",

"С":"ᛊ",

"Т":"ᛏ",

"У":"ᚢ",

"Ф":"ᚠ",

"Х":"ᚺ",

"Ц":"ᛏᛊ",

"Ю":"ᛃᚢ",

"Я":"ᛃᚨ",

"НГ":"ᛜ"

};



function translateRunes(){

let text=document
.getElementById("input")
.value
.toUpperCase();


text=text.replaceAll("НГ","§");


let result="";


for(let letter of text){


if(letter==="Ь" || letter==="Ъ"){
continue;
}


if(letter==="§"){
result+="ᛜ";
continue;
}


if(alphabet[letter]){
result+=alphabet[letter];
}

else{
result+=letter;
}


}


document.getElementById("output").innerHTML=result;

}


</script>


</body>
</html>
