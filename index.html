<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Рунописец</title>

<style>

body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:20px;
}

h1{
color:#d4af37;
}

textarea{
width:90%;
height:120px;
background:#222;
color:white;
border:2px solid #d4af37;
border-radius:10px;
font-size:35px;
padding:10px;
}

button{
background:#d4af37;
color:black;
border:0;
border-radius:10px;
padding:12px 20px;
margin:5px;
font-size:18px;
}

.keyboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(80px,1fr));
gap:10px;
margin-top:30px;
}

.key{
background:#222;
border:2px solid #555;
border-radius:10px;
padding:10px;
}

.rune{
color:#d4af37;
font-size:32px;
}

.letter{
font-size:20px;
}

</style>

</head>

<body>

<h1>ᚱᚢᚾᚨ Рунописец</h1>

<textarea id="text"></textarea>

<br>

<button onclick="copyText()">Копировать</button>
<button onclick="enterText()">Enter</button>
<button onclick="deleteText()">Удалить</button>
<button onclick="clearText()">Очистить</button>
