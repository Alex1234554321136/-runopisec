<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Русская руническая клавиатура</title>

<style>
body {
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

h1 {
    font-size:28px;
}

#text {
    width:90%;
    min-height:70px;
    font-size:24px;
    background:#222;
    color:white;
    border:2px solid #555;
    border-radius:10px;
    padding:10px;
}

.control button {
    background:#333;
    color:white;
    border:1px solid #777;
    border-radius:10px;
    padding:12px;
    margin:5px;
    font-size:16px;
}

.keyboard {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.key {
    background:#222;
    border:2px solid #777;
    border-radius:12px;
    padding:12px 5px;
}

.key:active {
    background:#555;
}

.rune {
    font-size:36px;
}

.letter {
    font-size:18px;
    margin-top:5px;
    color:#ccc;
}

#mode {
    margin:10px;
    font-size:18px;
}
</style>

</head>

<body>

<h1>ᚱ Русская руническая клавиатура</h1>

<div id="mode">Режим: Руны</div>

<textarea id="text" readonly></textarea>

<div class="control">
<button onclick="copyText()">📋 Копировать</button>
<button onclick="deleteText()">⌫ Удалить</button>
<button onclick="enterText()">↵ Enter</button>
<button onclick="spaceText()">␣ Пробел</button>
<button onclick="clearText()">Очистить</button>
<button onclick="switchMode()">🔄 Руны / Буквы</button>
</div>

<div class="keyboard" id="keyboard"></div>


<script>

const runes = [

["ᚨ","А"],
["ᛒ","Б"],
["ᚹ","В"],
["ᚷ","Г"],

["ᛞ","Д"],
["ᛖ","Е"],
["ᛖ","Ё"],
["ᛃ","Ж"],

["ᛉ","З"],
["ᛁ","И"],
["ᛃ","Й"],
["ᚲ","К"],

["ᛚ","Л"],
["ᛗ","М"],
["ᚾ","Н"],
["ᛟ","О"],

["ᛈ","П"],
["ᚱ","Р"],
["ᛋ","С"],
["ᛏ","Т"],

["ᚢ","У"],
["ᚠ","Ф"],
["ᚺ","Х"],

["ᛏᛋ","Ц"],
["ᚲᚺ","Ч"],
["ᛋᚺ","Ш"],
["ᛋᚲ","Щ"],

["ᛁ","Ы"],
["ᛖ","Э"],

["ᛃᚢ","Ю"],
["ᛃᚨ","Я"],

["ᛜ","НГ"]

];


let output = document.getElementById("text");
let keyboard = document.getElementById("keyboard");
let modeText = document.getElementById("mode");

let runeMode = true;
let history = [];


runes.forEach(r => {

    let button = document.createElement("div");

    button.className="key";

    button.innerHTML =
    `
    <div class="rune">${r[0]}</div>
    <div class="letter">${r[1]}</div>
    `;

    button.onclick=function(){

        if(runeMode){

            output.value += r[0];
            history.push(r[0]);

        } else {

            output.value += r[1];
            history.push(r[1]);

        }

    };

    keyboard.appendChild(button);

});


function switchMode(){

    runeMode = !runeMode;

    if(runeMode){
        modeText.innerHTML="Режим: Руны";
    } else {
        modeText.innerHTML="Режим: Буквы";
    }

}


function deleteText(){

    if(history.length>0){

        let last=history.pop();

        output.value=output.value.slice(0,-last.length);

    }

}


function clearText(){

    output.value="";
    history=[];

}


function enterText(){

    output.value+="\n";
    history.push("\n");

}


function spaceText(){

    output.value+=" ";
    history.push(" ");

}


function copyText(){

    navigator.clipboard.writeText(output.value);

    alert("Скопировано!");

}

</script>

</body>
</html>
