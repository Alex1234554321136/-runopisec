<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Русский рунный алфавит</title>

<style>

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    font-size: 36px;
    margin-bottom: 20px;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: auto;
}

.rune {
    background: #222;
    border: 2px solid #555;
    border-radius: 15px;
    padding: 20px;
    transition: 0.3s;
}

.rune:hover {
    transform: scale(1.08);
    border-color: white;
}

.symbol {
    font-size: 70px;
    margin-bottom: 10px;
}

.letter {
    font-size: 24px;
}

</style>

</head>

<body>

<h1>Русский рунный алфавит</h1>

<div class="container">
  <div class="rune">
    <div class="symbol">ᚠ</div>
    <div class="letter">А</div>
</div>

<div class="rune">
    <div class="symbol">ᚢ</div>
    <div class="letter">Б</div>
</div>

<div class="rune">

    <div class="letter">В</div>
</div>

<div class="rune">
    <div class="symbol">ᚨ</div>

</div>

<div class="rune">
    <div class="symbol">ᚱ</div>
    <div class="letter">Д</div>
</div>

<div class="rune">
    <div class="symbol">ᚲ</div>
    <div class="letter">Е</div>
</div>

<div class="rune">
    <div class="symbol">ᚷ</div>
    <div class="letter">Ж</div>
</div>

<div class="rune">
    <div class="symbol">ᚹ</div>
    <div class="letter">З</div>
</div>

<div class="rune">
    <div class="symbol">ᚺ</div>
    <div class="letter">И</div>
</div>

<div class="rune">
    <div class="symbol">ᚾ</div>
    <div class="letter">К</div>
</div>

<div class="rune">
    <div class="symbol">ᛁ</div>

</div>

<div class="rune">
    <div class="symbol">ᛃ</div>

</div>

<div class="rune">

</div>

<div class="rune">

</div>

<div class="rune">

</div>

</body>
</html>
