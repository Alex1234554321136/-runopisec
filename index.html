<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Runopisec 2.0 — Русская руническая клавиатура</title>


<style>

/* ===== ОСНОВА ===== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    padding:20px;

    min-height:100vh;

    background:#111;

    color:white;

    font-family:Arial, sans-serif;

    text-align:center;

    transition:0.3s;

}


h1{

    font-size:30px;

    margin-bottom:5px;

}


.subtitle{

    color:#aaa;

    margin-bottom:20px;

}


#mode{

    font-size:18px;

    color:#ccc;

    margin:10px;

}


/* ===== ПОЛЕ ТЕКСТА ===== */


#text{

    width:95%;

    min-height:130px;

    padding:15px;

    border-radius:15px;

    border:2px solid #666;

    background:#222;

    color:white;

    font-size:28px;

    resize:none;

}



/* ===== КНОПКИ ===== */


.toolbar{

    margin-top:20px;

}


.group{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:10px;

    margin-bottom:12px;

}


button{

    padding:12px 15px;

    border-radius:12px;

    border:2px solid #777;

    background:#333;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:0.2s;

}


button:hover{

    transform:scale(1.05);

}


button:active{

    background:#555;

}



/* ===== КЛАВИАТУРА ===== */


.keyboard{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;

    margin-top:25px;

}


.key{

    background:#222;

    border:2px solid #777;

    border-radius:15px;

    padding:15px 5px;

    cursor:pointer;

    transition:0.2s;

}


.key:hover{

    box-shadow:0 0 15px #888;

}


.key:active{

    transform:scale(0.9);

}


.rune{

    font-size:42px;

}


.letter{

    margin-top:5px;

    color:#bbb;

    font-size:18px;

}
  /* ===== ОКНА ===== */


.window{

    display:none;

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:rgba(0,0,0,0.8);

    z-index:100;

    padding:30px;

}



.window-box{

    background:#222;

    border:2px solid #777;

    border-radius:20px;

    padding:20px;

    max-height:85%;

    overflow:auto;

}



.card{

    background:#333;

    border:1px solid #777;

    border-radius:15px;

    padding:15px;

    margin:10px;

    font-size:20px;

}



/* ===== СТАТИСТИКА ===== */


.stats{

    margin-top:15px;

    color:#ccc;

    font-size:16px;

}



/* ===== ТЕМЫ ===== */


body.light{

    background:#eee;

    color:#111;

}


body.light #text{

    background:white;

    color:black;

}


body.light .key{

    background:white;

    color:black;

}


body.light button{

    background:white;

    color:black;

}



body.stone{

    background:#292929;

}


body.parchment{

    background:#d8c39a;

    color:#222;

}


body.parchment #text{

    background:#f5e6c8;

    color:#222;

}



body.wood{

    background:#3b2414;

}


body.northern{

    background:#071827;

}



/* ===== ПОЛНОЭКРАННЫЙ РЕЖИМ ===== */


.fullscreen-text{

    font-size:60px;

    padding:40px;

}



/* ===== АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНА ===== */


@media(max-width:600px){

    body{

        padding:10px;

    }


    h1{

        font-size:24px;

    }


    .rune{

        font-size:34px;

    }


    button{

        font-size:14px;

        padding:10px;

    }


    #text{

        font-size:22px;

    }

}



/* ===== АНИМАЦИЯ ===== */


@keyframes runeGlow{

    0%{

        transform:scale(1);

    }


    50%{

        transform:scale(1.15);

    }


    100%{

        transform:scale(1);

    }

}



.animate{

    animation:runeGlow 0.3s;

}



</style>

</head>
<body>

<h1>ᚱ Runopisec 2.0</h1>

<div class="subtitle">
Русская руническая клавиатура

Режим: Руны
</div>


<div class="toolbar">

</div>

🔄 Руны / Буквы

placeholder="Поиск..."
>

🌙 Тёмная

🪨 Камень

📜 Пергамент
</button>

🪵 Дерево
</button>

🌌 Северное сияние
</button>

Закрыть
</button>

</div>



<!-- ПОЛНОЭКРАННЫЕ РУНЫ -->


<div class="window" id="runeView">

<div class="window-box">

<div id="bigRuneText"
class="fullscreen-text">
</div>


<button onclick="closeRuneView()">
Закрыть
</button>


</div>

</div>
<script>


// ===== ДАННЫЕ РУН =====


const runes = [

["ᚨ","А"],
["ᛒ","Б"],
["ᚹ","В"],
["ᚷ","Г"],

["ᛞ","Д"],
["ᛖ","Е"],
["ᛖ","Ё"],
["ᛃ","Ж"],

["ᛉ","З"],
["ᛁ","И"],
["ᛃ","Й"],
["ᚲ","К"],

["ᛚ","Л"],
["ᛗ","М"],
["ᚾ","Н"],
["ᛟ","О"],

["ᛈ","П"],
["ᚱ","Р"],
["ᛋ","С"],
["ᛏ","Т"],

["ᚢ","У"],
["ᚠ","Ф"],
["ᚺ","Х"],

["ᛏᛋ","Ц"],
["ᚲᚺ","Ч"],
["ᛋᚺ","Ш"],
["ᛋᚲ","Щ"],

["ᛁ","Ы"],
["ᛖ","Э"],

["ᛃᚢ","Ю"],
["ᛃᚨ","Я"],

["ᛜ","НГ"]

];



// ===== ЭЛЕМЕНТЫ =====


const output = document.getElementById("text");

const keyboard = document.getElementById("keyboard");

const modeText = document.getElementById("mode");


let runeMode = true;



// ===== СТАТИСТИКА =====


function updateStats(){

    document.getElementById("symbols").innerHTML =
    output.value.length;


    let words = output.value.trim();

    document.getElementById("words").innerHTML =
    words ? words.split(/\s+/).length : 0;


    document.getElementById("runeCount").innerHTML =
    (output.value.match(/[ᚠ-ᛪ]/g)||[]).length;

}




// ===== СОЗДАНИЕ КЛАВИАТУРЫ =====


runes.forEach(function(r){


    let key = document.createElement("div");


    key.className="key";


    key.innerHTML = `

    <div class="rune">
    ${r[0]}
    </div>

    <div class="letter">
    ${r[1]}
    </div>

    `;



    key.onclick=function(){


        if(runeMode){

            output.value += r[0];

        }

        else{

            output.value += r[1];

        }



        updateStats();


        key.classList.add("animate");


        setTimeout(()=>{

            key.classList.remove("animate");

        },300);



    };



    keyboard.appendChild(key);



});




// ===== АВТОСОХРАНЕНИЕ =====


output.addEventListener("input",function(){

    localStorage.setItem(
        "draft",
        output.value
    );


    updateStats();

});



// восстановление черновика


let savedDraft =
localStorage.getItem("draft");


if(savedDraft){

    output.value=savedDraft;

    updateStats();

}
  // ===== ОСНОВНЫЕ ФУНКЦИИ =====



function switchMode(){

    runeMode = !runeMode;


    if(runeMode){

        modeText.innerHTML = "Режим: Руны";

    }else{

        modeText.innerHTML = "Режим: Буквы";

    }

}




function deleteText(){

    let value = output.value;


    if(value.length > 0){

        output.value = value.slice(0,-1);

        updateStats();

    }

}




function clearText(){

    output.value = "";

    updateStats();

}




function spaceText(){

    output.value += " ";

    updateStats();

}




// ===== КОПИРОВАНИЕ =====



function copyText(){

    navigator.clipboard.writeText(output.value);


    alert("Скопировано 📋");

}




// ===== СОХРАНЕНИЕ TXT =====



function downloadTXT(){


    let blob = new Blob(

        [output.value],

        {
            type:"text/plain;charset=utf-8"
        }

    );


    let link = document.createElement("a");


    link.href =
    URL.createObjectURL(blob);


    link.download =
    "runopisec.txt";


    link.click();

}




// ===== ТЕМЫ =====



function changeTheme(){

    openSettings();

}




function setTheme(theme){


    document.body.className="";


    if(theme!="dark"){

        document.body.classList.add(theme);

    }


    localStorage.setItem(
        "theme",
        theme
    );

}




// загрузка темы


let savedTheme =
localStorage.getItem("theme");


if(savedTheme){

    setTheme(savedTheme);

}




// ===== ОКНО НАСТРОЕК =====



function openSettings(){

    document.getElementById(
        "settingsWindow"
    ).style.display="block";

}




function closeSettings(){

    document.getElementById(
        "settingsWindow"
    ).style.display="none";

}
  // ===== ПЕРЕВОДЧИК =====



function russianToRunes(text){


    let result = "";


    for(let char of text.toUpperCase()){


        let found = runes.find(
            r => r[1] === char
        );


        if(found){

            result += found[0];

        }else{

            result += char;

        }


    }


    return result;

}





function runesToRussian(text){


    let result = text;



    // сложные сочетания сначала


    result =
    result.split("ᛃᚢ").join("Ю");


    result =
    result.split("ᛃᚨ").join("Я");


    result =
    result.split("ᛏᛋ").join("Ц");


    result =
    result.split("ᚲᚺ").join("Ч");


    result =
    result.split("ᛋᚺ").join("Ш");


    result =
    result.split("ᛋᚲ").join("Щ");





    runes.forEach(function(r){


        if(r[0].length===1){


            result =
            result.split(r[0]).join(r[1]);


        }


    });



    return result;


}





function translateText(){



    if(runeMode){


        output.value =
        runesToRussian(output.value);


        runeMode=false;


        modeText.innerHTML =
        "Режим: Буквы";


    }

    else{


        output.value =
        russianToRunes(output.value);


        runeMode=true;


        modeText.innerHTML =
        "Режим: Руны";


    }



    updateStats();


    localStorage.setItem(
        "draft",
        output.value
    );


}
  // ===== ИЗБРАННОЕ =====



function saveFavorite(){


    if(output.value.trim()===""){


        alert("Нет текста для сохранения");

        return;

    }



    let favorites =
    JSON.parse(
        localStorage.getItem("favorites")
    ) || [];



    favorites.push({

        text: output.value,

        date: new Date().toLocaleString(),

        pinned:false

    });



    localStorage.setItem(

        "favorites",

        JSON.stringify(favorites)

    );



    alert("Добавлено в избранное ⭐");


}





function openFavorites(){


    let favorites =
    JSON.parse(
        localStorage.getItem("favorites")
    ) || [];



    let list =
    document.getElementById(
        "favoritesList"
    );


    list.innerHTML="";



    if(favorites.length===0){


        list.innerHTML =
        "<p>Избранное пусто</p>";


    }




    favorites.forEach(function(item,index){



        let card =
        document.createElement("div");



        card.className="card";



        card.innerHTML=`

        <div>
        ${item.pinned ? "📌 " : ""}
        ${item.text}
        </div>

        <small>
        ${item.date}
        </small>


        <br>


        <button onclick="loadFavorite(${index})">
        Открыть
        </button>


        <button onclick="pinFavorite(${index})">
        📌
        </button>


        <button onclick="deleteFavorite(${index})">
        🗑
        </button>

        `;



        list.appendChild(card);



    });



    document.getElementById(
        "favoritesWindow"
    ).style.display="block";


}




function closeFavorites(){


    document.getElementById(
        "favoritesWindow"
    ).style.display="none";


}




function loadFavorite(index){


    let favorites =
    JSON.parse(
        localStorage.getItem("favorites")
    ) || [];



    output.value =
    favorites[index].text;



    updateStats();


    closeFavorites();


}





function deleteFavorite(index){


    let favorites =
    JSON.parse(
        localStorage.getItem("favorites")
    ) || [];



    favorites.splice(index,1);



    localStorage.setItem(

        "favorites",

        JSON.stringify(favorites)

    );



    openFavorites();


}




function pinFavorite(index){


    let favorites =
    JSON.parse(
        localStorage.getItem("favorites")
    ) || [];



    favorites[index].pinned =
    !favorites[index].pinned;



    localStorage.setItem(

        "favorites",

        JSON.stringify(favorites)

    );



    openFavorites();


}
  // ===== ИСТОРИЯ =====



function saveHistory(){


    if(output.value.trim()===""){


        alert("Нет текста для сохранения");


        return;


    }



    let history =

    JSON.parse(

        localStorage.getItem("history")

    ) || [];



    history.push({


        text: output.value,


        date: new Date().toLocaleString()


    });



    // максимум 50 записей


    if(history.length>50){


        history.shift();


    }



    localStorage.setItem(

        "history",

        JSON.stringify(history)

    );



    alert("Добавлено в историю 📖");


}







function openHistory(){



    let history =

    JSON.parse(

        localStorage.getItem("history")

    ) || [];



    let list =

    document.getElementById(

        "historyList"

    );



    list.innerHTML="";




    if(history.length===0){



        list.innerHTML=

        "<p>История пустая</p>";



    }





    history.forEach(function(item,index){



        let card =

        document.createElement("div");



        card.className="card";



        card.innerHTML=`


        <div>

        ${item.text}

        </div>


        <small>

        ${item.date}

        </small>


        <br>


        <button onclick="loadHistory(${index})">

        Открыть

        </button>


        <button onclick="deleteHistory(${index})">

        🗑 Удалить

        </button>


        `;



        list.appendChild(card);



    });




    document.getElementById(

        "historyWindow"

    ).style.display="block";



}






function closeHistory(){



    document.getElementById(

        "historyWindow"

    ).style.display="none";



}







function loadHistory(index){



    let history =

    JSON.parse(

        localStorage.getItem("history")

    ) || [];




    output.value =

    history[index].text;




    updateStats();



    closeHistory();



}







function deleteHistory(index){



    let history =

    JSON.parse(

        localStorage.getItem("history")

    ) || [];




    history.splice(index,1);




    localStorage.setItem(

        "history",

        JSON.stringify(history)

    );



    openHistory();



}







function clearHistory(){



    localStorage.removeItem(

        "history"

    );



    openHistory();



}
  // ===== ПОИСК =====



function searchFavorites(){


    let query =

    document.getElementById(
        "favoriteSearch"
    ).value.toLowerCase();



    let cards =

    document.querySelectorAll(
        "#favoritesList .card"
    );



    cards.forEach(function(card){



        if(
            card.innerText
            .toLowerCase()
            .includes(query)
        ){

            card.style.display="block";

        }

        else{

            card.style.display="none";

        }


    });


}







function searchHistory(){


    let query =

    document.getElementById(
        "historySearch"
    ).value.toLowerCase();



    let cards =

    document.querySelectorAll(
        "#historyList .card"
    );



    cards.forEach(function(card){



        if(
            card.innerText
            .toLowerCase()
            .includes(query)
        ){

            card.style.display="block";

        }

        else{

            card.style.display="none";

        }


    });


}







// ===== РЕЗЕРВНАЯ КОПИЯ =====




function exportBackup(){



    let backup = {


        favorites:

        JSON.parse(
            localStorage.getItem("favorites")
        ) || [],



        history:

        JSON.parse(
            localStorage.getItem("history")
        ) || [],



        draft:

        localStorage.getItem("draft") || "",



        theme:

        localStorage.getItem("theme") || "dark"



    };





    let blob =

    new Blob(

        [

            JSON.stringify(
                backup,
                null,
                2
            )

        ],

        {

            type:"application/json"

        }

    );





    let link =

    document.createElement("a");



    link.href =

    URL.createObjectURL(blob);



    link.download =

    "runopisec_backup.json";



    link.click();



}








function importBackup(event){



    let file =

    event.target.files[0];



    if(!file){

        return;

    }




    let reader =

    new FileReader();





    reader.onload=function(e){



        try{



            let backup =

            JSON.parse(
                e.target.result
            );



            localStorage.setItem(

                "favorites",

                JSON.stringify(
                    backup.favorites || []
                )

            );



            localStorage.setItem(

                "history",

                JSON.stringify(
                    backup.history || []
                )

            );



            localStorage.setItem(

                "draft",

                backup.draft || ""

            );



            localStorage.setItem(

                "theme",

                backup.theme || "dark"

            );



            alert(
                "Резервная копия восстановлена ✅"
            );



            location.reload();



        }


        catch{


            alert(
                "Ошибка файла"
            );


        }



    };




    reader.readAsText(file);



}
  // ===== КАРТИНКА С РУНАМИ =====



function makeImage(){


    if(output.value.trim()===""){


        alert("Нет текста для картинки");


        return;

    }





    let canvas =

    document.createElement("canvas");



    canvas.width = 1000;

    canvas.height = 400;





    let ctx =

    canvas.getContext("2d");





    // фон


    ctx.fillStyle="#222";


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );





    // руны


    ctx.fillStyle="white";


    ctx.textAlign="center";


    ctx.font="80px Arial";



    ctx.fillText(

        output.value,

        500,

        160

    );





    // перевод


    ctx.font="45px Arial";



    ctx.fillText(

        runesToRussian(output.value),

        500,

        270

    );






    let link =

    document.createElement("a");



    link.download=

    "runopisec.png";



    link.href=

    canvas.toDataURL();



    link.click();



}







// ===== ПОДЕЛИТЬСЯ =====




async function shareText(){



    if(
        navigator.share
    ){


        try{


            await navigator.share({

                title:
                "Runopisec",


                text:
                output.value


            });


        }


        catch(e){}



    }


    else{


        copyText();


        alert(
            "Текст скопирован"
        );


    }



}







// ===== УЛУЧШЕННОЕ КОПИРОВАНИЕ =====




async function copyText(){



    if(output.value===""){


        alert(
            "Нет текста"
        );


        return;


    }




    try{


        await navigator.clipboard.writeText(
            output.value
        );


        alert(
            "Скопировано 📋"
        );


    }


    catch{


        alert(
            "Не удалось скопировать"
        );


    }



}
  // ===== QR-КОД =====



function createQR(){


    if(output.value.trim()===""){


        alert(
            "Нет текста для QR-кода"
        );

function optimizeStorage() {

    let history =
        JSON.parse(
            localStorage.getItem("history")
        ) || [];

    // оставляем последние 100 записей
    if (history.length > 100) {
        history = history.slice(history.length - 100);

        localStorage.setItem(
            "history",
            JSON.stringify(history)
        );
    }

    let favorites =
        JSON.parse(
            localStorage.getItem("favorites")
        ) || [];

    // удаляем полностью пустые записи
    favorites = favorites.filter(item =>
        item &&
        item.text &&
        item.text.trim() !== ""
    );

    localStorage.setItem(
        "favorites",
        JSON.stringify(favorites)
    );

}






// ===== АВТОМАТИЧЕСКАЯ ОЧИСТКА =====

function cleanOldHistory(days = 90) {

    let history =
        JSON.parse(
            localStorage.getItem("history")
        ) || [];

    let now = Date.now();

    history = history.filter(item => {

        if (!item.date)
            return true;

        let time = new Date(item.date).getTime();

        if (isNaN(time))
            return true;

        return (
            now - time <
            days * 24 * 60 * 60 * 1000
        );

    });

    localStorage.setItem(
        "history",
        JSON.stringify(history)
    );

}

        +

    );

}

function importProject(file){


    if(!file) return;



    let reader =
    new FileReader();



    reader.onload=function(e){


        try{


            let backup =
            JSON.parse(e.target.result);



            if(backup.favorites)
                localStorage.setItem(
                    "favorites",
                    JSON.stringify(backup.favorites)
                );



            if(backup.history)
                localStorage.setItem(
                    "history",
                    JSON.stringify(backup.history)
                );



            if(backup.privateTexts)
                localStorage.setItem(
                    "privateTexts",
                    JSON.stringify(backup.privateTexts)
                );



            if(backup.favoriteRunes)
                localStorage.setItem(
                    "favoriteRunes",
                    JSON.stringify(backup.favoriteRunes)
                );



            if(backup.settings)
                localStorage.setItem(
                    "settings",
                    JSON.stringify(backup.settings)
                );



            if(backup.statistics)
                localStorage.setItem(
                    "appStats",
                    JSON.stringify(backup.statistics)
                );



            alert(
                "Резервная копия успешно восстановлена ✅"
            );



            location.reload();


        }

        catch{


            alert(
                "Не удалось открыть резервную копию."
            );


        }


    };



    reader.readAsText(file);

}

function showToast(message, duration = 2500) {

    let toast = document.createElement("div");

    toast.className = "toast";

    toast.innerText = message;

    document.body.appendChild(toast);

    requestAnimationFrame(() => {
        toast.classList.add("show");
    });

    setTimeout(() => {

        toast.classList.remove("show");

        setTimeout(() => {

            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }

        }, 300);

    }, duration);

}






function vibrate(ms = 20) {

    if (navigator.vibrate) {

        navigator.vibrate(ms);

    }

}






function keyEffect(element) {

    if (!element) return;

    element.classList.add("pressed");

    setTimeout(() => {

        element.classList.remove("pressed");

    }, 150);

}






function celebrate() {

    for (let i = 0; i < 30; i++) {

        let particle = document.createElement("div");

        particle.className = "particle";

        particle.style.left = Math.random() * 100 + "vw";

        particle.style.animationDelay =
            (Math.random() * 0.5) + "s";

        document.body.appendChild(particle);

        setTimeout(() => {

            particle.remove();

        }, 3000);

    }

}
