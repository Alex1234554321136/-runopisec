<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Рунописец</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
font-family:Arial,sans-serif;
color:white;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:25px;
font-size:38px;
color:#d4af37;
}

textarea{
width:100%;
height:180px;
background:#222;
color:white;
border:2px solid #d4af37;
border-radius:10px;
padding:15px;
font-size:22px;
resize:vertical;
outline:none;
}

.buttons{
margin-top:20px;
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
}

button{
background:#d4af37;
color:black;
border:none;
padding:15px 30px;
font-size:18px;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

.result{
margin-top:25px;
background:#222;
border:2px solid #d4af37;
border-radius:10px;
padding:20px;
min-height:120px;
font-size:28px;
word-break:break-word;
}

.keyboard{
margin-top:35px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
gap:12px;
}

.key{
background:#222;
border:2px solid #555;
border-radius:10px;
padding:12px;
text-align:center;
cursor:pointer;
transition:.2s;
font-size:28px;
}

.key:hover{
border-color:#d4af37;
transform:scale(1.05);
}

.alphabet{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
gap:12px;
}

.card{
background:#222;
border:2px solid #444;
border-radius:10px;
padding:15px;
text-align:center;
}

.rune{
font-size:42px;
color:#d4af37;
}

.letter{
margin-top:10px;
font-size:22px;
}

@media(max-width:700px){

textarea{
font-size:18px;
}

.result{
font-size:22px;
}

button{
width:100%;
}

}

</style>

</head>
