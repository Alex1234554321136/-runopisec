<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Русский рунный алфавит</title>

<style>
body {
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial;
}

.runes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
}

.rune {
    background: #222;
    border: 1px solid #555;
    padding: 20px;
    font-size: 35px;
}

.letter {
    font-size: 20px;
}
</style>

</head>

<body>

<h1>Русский рунный алфавит</h1>

<div class="runes">

<div class="rune">ᚨ<div class="letter">А</div></div>
<div class="rune">ᛒ<div class="letter">Б</div></div>
<div class="rune">ᚲ<div class="letter">В</div></div>
<div class="rune">ᛞ<div class="letter">Г</div></div>
<div class="rune">ᛖ<div class="letter">Д</div></div>
<div class="rune">ᚠ<div class="letter">Е</div></div>

</div>

</body>
</html>
