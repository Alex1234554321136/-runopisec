<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ᚱ Рунописец</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

textarea{
    width:95%;
    height:150px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
    font-size:22px;
    resize:none;
}

.keyboard{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-top:20px;
}

button{
    background:#222;
    color:white;
    border:1px solid #666;
    border-radius:10px;
    padding:15px;
    font-size:24px;
}

button:active{
    background:#555;
}

.menu{
    margin-top:20px;
}

.menu button{
    width:140px;
    margin:5px;
}

</style>

</head>

<body>

<h1>ᚱ Рунописец</h1>

<textarea id="text"></textarea>

<div class="keyboard">

<button onclick="add('ᚨ')">ᚨ</button>
<button onclick="add('ᛒ')">ᛒ</button>
<button onclick="add('ᚹ')">ᚹ</button>
<button onclick="add('ᚷ')">ᚷ</button>
<button onclick="add('ᛞ')">ᛞ</button>
<button onclick="add('ᛖ')">ᛖ</button>

<button onclick="add('ᛃ')">ᛃ</button>
<button onclick="add('ᛉ')">ᛉ</button>
<button onclick="add('ᛁ')">ᛁ</button>
<button onclick="add('ᚲ')">ᚲ</button>
<button onclick="add('ᛚ')">ᛚ</button>
<button onclick="add('ᛗ')">ᛗ</button>

<button onclick="add('ᚾ')">ᚾ</button>
<button onclick="add('ᛟ')">ᛟ</button>
<button onclick="add('ᛈ')">ᛈ</button>
<button onclick="add('ᚱ')">ᚱ</button>
<button onclick="add('ᛊ')">ᛊ</button>
<button onclick="add('ᛏ')">ᛏ</button>

<button onclick="add('ᚢ')">ᚢ</button>
<button onclick="add('ᚠ')">ᚠ</button>
<button onclick="add('ᚺ')">ᚺ</button>
<button onclick="add('ᛜ')">ᛜ</button>

</div>

<div class="menu">

<button onclick="copyText()">Копировать</button>

<button onclick="clearText()">Очистить</button>

</div>

<script>

function add(r){
document.getElementById("text").value+=r;
}

function clearText(){
document.getElementById("text").value="";
}

function copyText(){

let t=document.getElementById("text");

t.select();

navigator.clipboard.writeText(t.value);

alert("Текст скопирован");

}

</script>

</body>
</html>
