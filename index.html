<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Руническая клавиатура</title>

<style>

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 32px;
}

#text {
    width: 90%;
    height: 150px;
    background: #222;
    color: white;
    font-size: 35px;
    padding: 15px;
    border-radius: 15px;
    border: 2px solid #555;
    resize: none;
}

.controls {
    margin: 20px;
}

button {
    font-size: 20px;
    padding: 12px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
}

.keyboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
    gap: 10px;
    max-width: 900px;
    margin: auto;
}

.rune-button {
    background: #222;
    color: white;
    border: 2px solid #555;
    border-radius: 15px;
    padding: 15px;
}

.rune {
    font-size: 45px;
}

.letter {
    font-size: 20px;
}

</style>

</head>


<body>

<h1>Руническая клавиатура</h1>


<textarea id="text" placeholder="Пиши рунами здесь..."></textarea>


<div class="controls">

<button onclick="addSpace()">Пробел</button>

<button onclick="addEnter()">Enter</button>

<button onclick="deleteRune()">Удалить</button>

<button onclick="clearText()">Очистить</button>

<button onclick="copyText()">Копировать</button>

</div>


<div class="keyboard" id="keyboard">
  <script>

const runeAlphabet = [
    {letter:"А", rune:"ᚨ"},
    {letter:"Б", rune:"ᛒ"},
    {letter:"В", rune:"ᚹ"},
    {letter:"Г", rune:"ᚷ"},
    {letter:"Д", rune:"ᛞ"},
    {letter:"Е", rune:"ᛖ"},
    {letter:"Ж", rune:"ᛃ"},
    {letter:"З", rune:"ᛉ"},
    {letter:"И", rune:"ᛁ"},
    {letter:"К", rune:"ᚲ"},
    {letter:"Л", rune:"ᛚ"},
    {letter:"М", rune:"ᛗ"},
    {letter:"Н", rune:"ᚾ"},
    {letter:"О", rune:"ᛟ"},
    {letter:"П", rune:"ᛈ"},
    {letter:"Р", rune:"ᚱ"},
    {letter:"С", rune:"ᛋ"},
    {letter:"Т", rune:"ᛏ"},
    {letter:"У", rune:"ᚢ"},
    {letter:"Ф", rune:"ᚠ"},
    {letter:"Х", rune:"ᚺ"},
    {letter:"Ц", rune:"ᛜ"},
    {letter:"Ч", rune:"ᛇ"},
    {letter:"Ш", rune:"ᚦ"}
];

</script>
<script>

const keyboard = document.getElementById("keyboard");
const text = document.getElementById("text");


// создание кнопок рун
runeAlphabet.forEach(item => {

    let button = document.createElement("button");

    button.className = "rune-button";

    button.innerHTML =
    '<div class="rune">' + item.rune + '</div>' +
    '<div class="letter">' + item.letter + '</div>';

    button.onclick = function(){

        text.value += item.rune;

        saveText();

    };

    keyboard.appendChild(button);

});


// пробел

function addSpace(){

    text.value += " ";

    saveText();

}


// Enter

function addEnter(){

    text.value += "\n";

    saveText();

}


// удалить последнюю руну

function deleteRune(){

    text.value = text.value.slice(0,-1);

    saveText();

}


// очистить

function clearText(){

    text.value = "";

    saveText();

}


// копировать

function copyText(){

    navigator.clipboard.writeText(text.value);

}


// сохранение

function saveText(){

    localStorage.setItem(
        "runeText",
        text.value
    );

}


// загрузка сохранённого текста

window.onload = function(){

    text.value =
    localStorage.getItem("runeText") || "";

}


</script>


</body>
</html>
