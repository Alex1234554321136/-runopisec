<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ᚱ Рунописец</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Рунописец">

<style>

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin:0 0 15px;
    font-size:34px;
}

.mode{
    font-size:20px;
    margin-bottom:15px;
}

textarea{
    width:95%;
    height:180px;
    background:#222;
    color:white;
    border:2px solid #555;
    border-radius:12px;
    padding:10px;
    font-size:28px;
    resize:none;
    box-sizing:border-box;
}

.controls{
    margin-top:15px;
}

.controls button{
    margin:4px;
}

.keyboard{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:8px;
    margin-top:20px;
}

button{
    background:#333;
    color:white;
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:22px;
    cursor:pointer;
}

button:hover{
    background:#555;
}

.rune{
    font-size:34px;
}

.letter{
    font-size:15px;
    opacity:.8;
}

.runeMode .rune{
    font-size:34px;
}

.runeMode .letter{
    font-size:15px;
}

.letterMode .rune{
    font-size:15px;
}

.letterMode .letter{
    font-size:34px;
}

.light{
    background:#f2f2f2;
    color:#111;
}

.light textarea{
    background:white;
    color:#111;
    border-color:#999;
}

.light button{
    background:#ddd;
    color:#111;
}

</style>
</head>

<body>

<h1>ᚱ Рунописец</h1>

<div id="modeText" class="mode">
Режим: Руны
</div>

<textarea id="text" placeholder="Здесь появится ваш текст..."></textarea>

<div class="controls"></div>

<div class="keyboard"></div>
<div class="controls">

<button onclick="deleteText()">⌫ Удалить</button>
<button onclick="spaceText()">␣ Пробел</button>
<button onclick="enterText()">↵ Enter</button>
<button onclick="clearText()">🗑 Очистить</button>

</div>

<div class="controls">

<button onclick="copyText()">📋 Копировать</button>

<button onclick="switchMode()">🔄 Сменить режим</button>

</div>

<div class="controls">

<button onclick="translateToRunes()">🔤 → ᚱ Перевести в руны</button>

<button onclick="translateToRussian()">ᚱ → 🔤 Перевести в буквы</button>

</div>

<div class="controls">

<button onclick="saveHistory()">📜 В историю</button>
<button onclick="showHistory()">📖 История</button>
<button onclick="clearHistory()">🗑 Очистить историю</button>

</div>

<div class="controls">

<button onclick="saveFavorite()">⭐ В избранное</button>
<button onclick="showFavorites()">⭐ Избранное</button>
<button onclick="clearFavorites()">🗑 Очистить избранное</button>

</div>

<div class="controls">

<button onclick="changeTheme()">🌗 Сменить тему</button>

<button onclick="downloadTXT()">📄 Скачать TXT</button>

</div>
<script>

const runes = [

["ᚨ","А"],
["ᛒ","Б"],
["ᚹ","В"],
["ᚷ","Г"],
["ᛞ","Д"],
["ᛖ","Е"],
["ᛖ","Ё"],
["ᛃ","Ж"],
["ᛉ","З"],
["ᛁ","И"],
["ᛃ","Й"],
["ᚲ","К"],
["ᛚ","Л"],
["ᛗ","М"],
["ᚾ","Н"],
["ᛟ","О"],
["ᛈ","П"],
["ᚱ","Р"],
["ᛋ","С"],
["ᛏ","Т"],
["ᚢ","У"],
["ᚠ","Ф"],
["ᚺ","Х"],
["ᛏᛋ","Ц"],
["ᚲᚺ","Ч"],
["ᛋᚺ","Ш"],
["ᛋᚲ","Щ"],
["ᛁ","Ы"],
["ᛖ","Э"],
["ᛃᚢ","Ю"],
["ᛃᚨ","Я"],
["ᛜ","НГ"]

];

let runeMode = true;

const keyboard = document.querySelector(".keyboard");

function addRune(value){
    document.getElementById("text").value += value;
}

runes.forEach(function(item){

    const button = document.createElement("button");

    button.className = "runeMode";

    button.innerHTML =
    '<div class="rune">'+item[0]+'</div>' +
    '<div class="letter">'+item[1]+'</div>';

    button.onclick = function(){
        addRune(item[0]);
    };

    keyboard.appendChild(button);

});
  function deleteText(){
    let text = document.getElementById("text");
    text.value = text.value.slice(0,-1);
}

function spaceText(){
    document.getElementById("text").value += " ";
}

function enterText(){
    document.getElementById("text").value += "\n";
}

function clearText(){
    document.getElementById("text").value = "";
}

function copyText(){
    let text = document.getElementById("text").value;
    navigator.clipboard.writeText(text);
    alert("Текст скопирован!");
}

function updateKeyboardMode(){

    document.querySelectorAll(".keyboard button").forEach(function(button){

        if(runeMode){
            button.classList.remove("letterMode");
            button.classList.add("runeMode");
        }else{
            button.classList.remove("runeMode");
            button.classList.add("letterMode");
        }

    });

}

function switchMode(){

    runeMode = !runeMode;

    document.getElementById("modeText").textContent =
        runeMode ? "Режим: Руны" : "Режим: Буквы";

    updateKeyboardMode();

}
  function translateToRunes(){

    let text = document.getElementById("text");
    let result = "";
    let value = text.value.toUpperCase();

    for(let i = 0; i < value.length; i++){

        let found = runes.find(function(item){
            return item[1] === value[i];
        });

        result += found ? found[0] : value[i];

    }

    text.value = result;

}

const complexRunes = [

["ᛃᚢ","Ю"],
["ᛃᚨ","Я"],
["ᛏᛋ","Ц"],
["ᚲᚺ","Ч"],
["ᛋᚺ","Ш"],
["ᛋᚲ","Щ"]

];

function translateToRussian(){

    let result = document.getElementById("text").value;

    complexRunes.forEach(function(item){
        result = result.split(item[0]).join(item[1]);
    });

    runes.forEach(function(item){
        result = result.split(item[0]).join(item[1]);
    });

    document.getElementById("text").value = result;

}
  function saveHistory(){

    let text = document.getElementById("text").value;

    if(text.trim() === "") return;

    let history = JSON.parse(localStorage.getItem("runopisecHistory")) || [];

    history.push(text);

    localStorage.setItem(
        "runopisecHistory",
        JSON.stringify(history)
    );

    alert("Текст сохранён в историю!");

}

function showHistory(){

    let history = JSON.parse(localStorage.getItem("runopisecHistory")) || [];

    if(history.length === 0){
        alert("История пустая");
        return;
    }

    alert(history.join("\n\n──────────\n\n"));

}

function clearHistory(){

    localStorage.removeItem("runopisecHistory");

    alert("История очищена");

}
  function saveFavorite(){

    let text = document.getElementById("text").value;

    if(text.trim() === "") return;

    let favorites = JSON.parse(localStorage.getItem("runopisecFavorites")) || [];

    favorites.push(text);

    localStorage.setItem(
        "runopisecFavorites",
        JSON.stringify(favorites)
    );

    alert("Добавлено в избранное!");

}

function showFavorites(){

    let favorites = JSON.parse(localStorage.getItem("runopisecFavorites")) || [];

    if(favorites.length === 0){
        alert("Избранное пустое");
        return;
    }

    alert(favorites.join("\n\n⭐\n\n"));

}

function clearFavorites(){

    localStorage.removeItem("runopisecFavorites");

    alert("Избранное очищено");

}
  let savedText = localStorage.getItem("runopisecText");

if(savedText){
    document.getElementById("text").value = savedText;
}

document.getElementById("text").addEventListener("input", function(){
    localStorage.setItem("runopisecText", this.value);
});

let savedTheme = localStorage.getItem("runopisecTheme");

if(savedTheme === "light"){
    document.body.classList.add("light");
}

function changeTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "runopisecTheme",
        document.body.classList.contains("light") ? "light" : "dark"
    );

}

function downloadTXT(){

    let text = document.getElementById("text").value;

    if(text.trim() === "") return;

    let file = new Blob([text], {type:"text/plain;charset=utf-8"});

    let link = document.createElement("a");

    link.href = URL.createObjectURL(file);
    link.download = "runopisec.txt";
    link.click();

    URL.revokeObjectURL(link.href);

}
  </script>

</body>
</html>
