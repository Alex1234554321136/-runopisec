<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Русская руническая клавиатура</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:10px;
    font-size:30px;
}

#mode{
    margin:10px 0;
    font-size:18px;
    color:#ddd;
}

#text{
    width:95%;
    min-height:120px;
    margin-top:15px;
    padding:12px;
    font-size:24px;
    border-radius:12px;
    border:2px solid #555;
    background:#222;
    color:white;
    resize:vertical;
}

.toolbar{
    margin-top:20px;
}

.group{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:12px;
}

button{

    background:#2d2d2d;
    color:white;
    border:2px solid #666;
    border-radius:10px;
    padding:12px 16px;
    font-size:16px;
    cursor:pointer;
    transition:0.2s;

}

button:hover{

    background:#444;

}

.keyboard{

    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:25px;

}

.key{

    background:#222;
    border:2px solid #666;
    border-radius:12px;
    padding:12px;
    cursor:pointer;
    transition:0.2s;

}

.key:hover{

    background:#3a3a3a;

}

.rune{

    font-size:38px;

}

.letter{

    font-size:18px;
    color:#ccc;
    margin-top:5px;

}

.light{

    background:#f5f5f5;
    color:#111;

}

.light #text{

    background:white;
    color:black;
    border:2px solid #999;

}

.light .key{

    background:white;
    color:black;

}

.light button{

    background:white;
    color:black;

}

</style>

</head>

<body>

<h1>ᚱ Русская руническая клавиатура</h1>

<div id="mode">
Режим: Руны
</div>

<div class="toolbar">

<div class="group">

<button onclick="copyText()">📋 Копировать</button>

<button onclick="downloadTXT()">💾 TXT</button>

<button onclick="downloadPNG()">🖼 PNG</button>

</div>

<div class="group">

<button onclick="switchMode()">🔄 Руны / Буквы</button>

<button onclick="translateText()">🔄 Перевести</button>

</div>

<div class="group">

<button onclick="favorites()">⭐ Избранное</button>

<button onclick="historyList()">📖 История</button>

</div>

<div class="group">

<button onclick="changeTheme()">🎨 Тема</button>

<button onclick="settings()">⚙ Настройки</button>

</div>

<div class="group">

<button onclick="deleteText()">⌫ Удалить</button>

<button onclick="enterText()">↵ Enter</button>

<button onclick="spaceText()">␣ Пробел</button>

<button onclick="clearText()">🗑 Очистить</button>

</div>

</div>

<textarea id="text" readonly></textarea>

<div class="keyboard" id="keyboard">
</div>
<script>

const runes = [

["ᚨ","А"],
["ᛒ","Б"],
["ᚹ","В"],
["ᚷ","Г"],

["ᛞ","Д"],
["ᛖ","Е"],
["ᛖ","Ё"],
["ᛃ","Ж"],

["ᛉ","З"],
["ᛁ","И"],
["ᛃ","Й"],
["ᚲ","К"],

["ᛚ","Л"],
["ᛗ","М"],
["ᚾ","Н"],
["ᛟ","О"],

["ᛈ","П"],
["ᚱ","Р"],
["ᛋ","С"],
["ᛏ","Т"],

["ᚢ","У"],
["ᚠ","Ф"],
["ᚺ","Х"],

["ᛏᛋ","Ц"],
["ᚲᚺ","Ч"],
["ᛋᚺ","Ш"],
["ᛋᚲ","Щ"],

["ᛁ","Ы"],
["ᛖ","Э"],

["ᛃᚢ","Ю"],
["ᛃᚨ","Я"],

["ᛜ","НГ"]

];

let output = document.getElementById("text");
let keyboard = document.getElementById("keyboard");
let modeText = document.getElementById("mode");

let runeMode = true;
let history = [];

runes.forEach(function(r){

    let key = document.createElement("div");

    key.className = "key";

    key.innerHTML =
    `
    <div class="rune">${r[0]}</div>
    <div class="letter">${r[1]}</div>
    `;

    key.onclick = function(){

        if(runeMode){

            output.value += r[0];
            history.push(r[0]);

        }else{

            output.value += r[1];
            history.push(r[1]);

        }

    };

    keyboard.appendChild(key);

});
  function switchMode(){

    runeMode = !runeMode;

    if(runeMode){
        modeText.innerHTML = "Режим: Руны";
    }else{
        modeText.innerHTML = "Режим: Буквы";
    }

}

function deleteText(){

    if(history.length > 0){

        let last = history.pop();

        output.value = output.value.slice(0,-last.length);

    }

}

function clearText(){

    output.value = "";
    history = [];

}

function enterText(){

    output.value += "\n";
    history.push("\n");

}

function spaceText(){

    output.value += " ";
    history.push(" ");

}

function copyText(){

    navigator.clipboard.writeText(output.value);

    alert("Скопировано!");

}

function downloadTXT(){

    let blob = new Blob([output.value], {type:"text/plain;charset=utf-8"});

    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "runopisec.txt";

    a.click();

}

function downloadPNG(){

    alert("Функция сохранения PNG будет добавлена в следующей части.");

}
  function translateText(){

    alert("Переводчик будет расширен в следующей версии.");

}

function favorites(){

    alert("Избранные руны появятся в следующем обновлении.");

}

function historyList(){

    if(history.length===0){

        alert("История пуста");

        return;

    }

    alert(history.join(""));

}

function changeTheme(){

    document.body.classList.toggle("light");

}

function settings(){

    alert(
`Настройки

• Размер клавиатуры
• Размер рун
• Размер букв
• Звуки
• Тема`

    );

}
