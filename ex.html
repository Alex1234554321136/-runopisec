<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Русский рунный алфавит</title>

<style>
body {
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    padding: 20px;
}

h1 {
    font-size: 36px;
    color: #d4af37;
}

.runes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 700px;
    margin: 30px auto;
}

.rune {
    background: #222;
    border: 2px solid #d4af37;
    border-radius: 15px;
    padding: 20px;
    font-size: 60px;
    color: #fff;
}

.name {
    font-size: 22px;
    color: #d4af37;
    margin-top: 10px;
}

.sound {
    font-size: 18px;
    margin-top: 5px;
}

@media(max-width:600px){
    .runes {
        grid-template-columns: repeat(2,1fr);
    }

    .rune {
        font-size: 50px;
    }
}
</style>

</head>

<body>

<h1>Русский рунный алфавит</h1>

<div class="runes">

<div class="rune">
ᚨ
<div class="name">Альфа</div>
<div class="sound">А</div>
</div>

<div class="rune">
ᛒ
<div class="name">Берк</div>
<div class="sound">Б</div>
</div>

<div class="rune">
ᚲ
<div class="name">Кен</div>
<div class="sound">К</div>
</div>

<div class="rune">
ᛞ
<div class="name">Даг</div>
<div class="sound">Д</div>
</div>

<div class="rune">
ᛖ
<div class="name">Эваз</div>
<div class="sound">Е</div>
</div>

<div class="rune">
ᚠ
<div class="name">Феху</div>
<div class="sound">Ф</div>
</div>

<div class="rune">
ᚷ
<div class="name">Гебо</div>
<div class="sound">Г</div>
</div>

<div class="rune">
ᚺ
<div class="name">Хагал</div>
<div class="sound">Х</div>
</div>

<div class="rune">
ᛁ
<div class="name">Иса</div>
<div class="sound">И</div>
</div>

</div>

</body>
</html>
